<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Conferir escudos · Gabriel Rodriguez</title><link rel="stylesheet" href="preview-fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f3;color:#24313b;font:15px/1.65 'DM Sans',sans-serif}main{max-width:1000px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}header img{width:220px;max-width:50vw}h1{font:600 32px Outfit,sans-serif;margin-top:40px}a{color:#806318}button{font:inherit;min-height:44px;padding:10px 16px;border:1px solid #dbe2d9;border-radius:5px;background:white;color:#24313b;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}#auditSummary{font-weight:600}#auditList{list-style:none;padding:0}#auditList li{background:#fff;border:1px solid #e0e4dd;border-radius:8px;padding:20px;margin:16px 0}#auditList h2{font:600 22px Outfit,sans-serif;margin:0 0 8px}#auditList p{margin:4px 0;color:#596974;overflow-wrap:anywhere}#auditEmpty{padding:24px;background:#eef2e9;border-radius:8px}button:focus-visible,a:focus-visible{outline:3px solid #bd942b;outline-offset:4px}</style></head><body><main><header><a href="/"><img src="assets/brand/gabriel-rodriguez.svg?v=2" alt="Gabriel Rodriguez"></a><a href="/#stadiums">Ver estádios ↗</a></header><h1>Conferência de escudos</h1><p>A lista verifica as equipes dos jogos salvos na coleção atual. Jogos de lotes ainda não incluídos aparecem depois que forem gravados.</p><p id="auditSummary" role="status" aria-live="polite">Carregando os jogos…</p><div class="actions"><button type="button" id="refreshAudit">Atualizar conferência</button><button type="button" id="copyAudit" disabled>Copiar lista</button><button type="button" id="downloadAudit" disabled>Baixar lista</button></div><p id="auditEmpty" hidden>Todos os nomes de equipes nos jogos salvos têm um escudo associado.</p><ul id="auditList" aria-label="Equipes sem escudo"></ul><p id="auditMessage" role="status"></p></main><script src="atlas-cloud-config.js?v=14"></script><script src="atlas-cloud.js?v=19"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();let report='';$('#refreshAudit').onclick=()=>location.reload();$('#copyAudit').onclick=async()=>{try{await navigator.clipboard.writeText(report);$('#auditMessage').textContent='Lista copiada.'}catch{$('#auditMessage').textContent='Não foi possível copiar. Use Baixar lista.'}};$('#downloadAudit').onclick=()=>{const url=URL.createObjectURL(new Blob([report],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='escudos-a-conferir.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
Promise.all([AtlasCloud.ready,fetch('assets/teams/crest-aliases.json?v=10').then(r=>{if(!r.ok)throw Error('Não foi possível carregar os escudos.');return r.json()})]).then(([,aliases])=>{if(!aliases||typeof aliases!=='object'||Array.isArray(aliases))throw Error('Não foi possível conferir os escudos.');const visits=JSON.parse(localStorage.getItem('my-football-atlas-v1')||'[]');if(!Array.isArray(visits))throw Error('Não foi possível carregar os jogos.');const names=new Set(),missing=new Map();let games=0;for(const v of visits)for(const g of Array.isArray(v.matches)?v.matches:[]){if(!g||typeof g!=='object')continue;games++;for(const key of ['homeTeam','awayTeam']){const label=String(g[key]||'').trim(),name=norm(label);if(!name)continue;names.add(name);if(Number.isInteger(aliases[name]))continue;if(!missing.has(name))missing.set(name,{label,refs:new Set()});missing.get(name).refs.add([v.stadium,g.date,[g.homeTeam,g.awayTeam].filter(Boolean).join(' × ')].filter(Boolean).join(' — '))}}const summary=games+' jogos verificados · '+names.size+' nomes de equipes · '+missing.size+' sem escudo';$('#auditSummary').textContent=summary;$('#auditEmpty').hidden=missing.size!==0;const lines=[summary,''];for(const {label,refs}of [...missing.values()].sort((a,b)=>a.label.localeCompare(b.label,'pt'))){const li=document.createElement('li'),h=document.createElement('h2');h.textContent=label;li.append(h);lines.push(label);for(const ref of refs){const p=document.createElement('p');p.textContent=ref;li.append(p);lines.push('  '+ref)}$('#auditList').append(li);lines.push('')}if(!missing.size)lines.push('Todos os nomes de equipes nos jogos salvos têm um escudo associado.');report=lines.join('\n');$('#copyAudit').disabled=false;$('#downloadAudit').disabled=false}).catch(e=>{$('#auditSummary').textContent=e.message||'Não foi possível carregar a conferência. Tente atualizar a página.'});})();
</script></body></html>
